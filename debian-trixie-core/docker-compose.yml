services:
  kasm-base:
    build:
      context: .
      dockerfile: Dockerfile
      # args:
      #   APT_MIRROR: mirrors.ustc.edu.cn
    image: ghcr.io/sion10032/kasmweb/debian-trixie-core:latest
    container_name: kasm-base
    ports:
      # KasmVNC web 访问（https）
      - "6901:6901"
    environment:
      # KasmVNC web 登录密码
      - VNC_PW=password
      # 桌面分辨率
      - VNC_RESOLUTION=1280x720
    # openbox + KasmVNC 调试用，1gb 足够
    shm_size: '1gb'
    restart: unless-stopped
