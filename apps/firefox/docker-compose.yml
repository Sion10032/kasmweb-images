services:
  firefox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 本地开发联调：base 镜像用 dev tag
        BASE_IMAGE: ghcr.io/sion10032/kasmweb/debian-trixie-core:dev
        # APT_MIRROR: mirrors.ustc.edu.cn
    image: ghcr.io/sion10032/kasmweb/firefox:dev
    container_name: firefox
    ports:
      - "6901:6901"
    environment:
      # KasmVNC web 登录用户名（默认 kasm_user）
      - VNC_USER=kasm_user
      # KasmVNC web 登录密码
      - VNC_PW=password
      # 桌面分辨率
      - VNC_RESOLUTION=1280x720
    volumes:
      - ./data:/home/kasm-user
    # Firefox 需要共享内存以正常渲染
    shm_size: '2gb'
    restart: unless-stopped
