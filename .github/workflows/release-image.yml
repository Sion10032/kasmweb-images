name: Release Image

# 可复用 workflow：构建并推送单个镜像到 GHCR + 自动生成 GitHub Release
# 由 docker.yml 按镜像调用，参数见 inputs
on:
  workflow_call:
    inputs:
      # GHCR 镜像全名，如 ghcr.io/sion10032/kasmweb/qq
      image:
        required: true
        type: string
      # 构建上下文目录，如 ./apps/qq
      context:
        required: true
        type: string
      # 发版 tag 前缀，如 qq-v（tag 形如 qq-v0.1.0，冒号后为版本号）
      tag-prefix:
        required: true
        type: string
      # changelog 的 git log 路径（空格分隔，可含旧路径以跟随重命名）
      changelog-paths:
        required: true
        type: string
      # buildx 缓存 scope（GH Actions 缓存 key 维度，建议用镜像短名）
      cache-scope:
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#${{ inputs.tag-prefix }}}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.VERSION }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max

      - name: Generate changelog
        id: changelog
        env:
          CHANGELOG_PATHS: ${{ inputs.changelog-paths }}
        run: |
          PREV_TAG=$(git tag --list "${{ inputs.tag-prefix }}*" --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
          {
            echo "notes<<EOF"
            echo "## Changes"
            git log ${RANGE:-HEAD} --pretty=format:"- %s (%h)" -- ${CHANGELOG_PATHS}
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
