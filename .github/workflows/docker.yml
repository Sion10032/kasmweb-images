name: Docker

on:
  push:
    tags:
      - "debian-trixie-core-v*"
      - "qq-v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/sion10032/kasmweb/debian-trixie-core
  QQ_IMAGE: ghcr.io/sion10032/kasmweb/qq

jobs:
  base:
    if: startsWith(github.ref_name, 'debian-trixie-core-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#debian-trixie-core-v}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata (base)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BASE_IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.VERSION }}
            type=raw,value=latest
      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: ./debian-trixie-core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=debian-trixie-core
          cache-to: type=gha,scope=debian-trixie-core,mode=max

  qq:
    if: startsWith(github.ref_name, 'qq-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#qq-v}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata (qq)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.QQ_IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.VERSION }}
            type=raw,value=latest
      - name: Build and push qq
        uses: docker/build-push-action@v6
        with:
          context: ./apps/qq
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=qq
          cache-to: type=gha,scope=qq,mode=max
