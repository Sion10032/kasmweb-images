name: Docker

# 入口 workflow：按 tag 前缀分发给可复用 workflow release-image.yml
# 新增镜像只需在 jobs 中加一段（image / context / tag-prefix / changelog-paths / cache-scope）
on:
  push:
    tags:
      - "debian-trixie-core-v*"
      - "qq-v*"
      - "firefox-v*"
      - "wechat-v*"

permissions:
  contents: write
  packages: write

jobs:
  debian-trixie-core:
    if: startsWith(github.ref_name, 'debian-trixie-core-')
    uses: ./.github/workflows/release-image.yml
    with:
      image: ghcr.io/sion10032/kasmweb/debian-trixie-core
      context: ./debian-trixie-core
      tag-prefix: debian-trixie-core-v
      # 含旧路径 base/：目录由 base/ 重命名而来，git log --path 不跟随重命名
      changelog-paths: "debian-trixie-core/ base/"
      cache-scope: debian-trixie-core

  qq:
    if: startsWith(github.ref_name, 'qq-')
    uses: ./.github/workflows/release-image.yml
    with:
      image: ghcr.io/sion10032/kasmweb/qq
      context: ./apps/qq
      tag-prefix: qq-v
      # 含旧路径 apps/linuxqq/：目录由 apps/linuxqq/ 重命名而来
      changelog-paths: "apps/qq/ apps/linuxqq/"
      cache-scope: qq

  firefox:
    if: startsWith(github.ref_name, 'firefox-')
    uses: ./.github/workflows/release-image.yml
    with:
      image: ghcr.io/sion10032/kasmweb/firefox
      context: ./apps/firefox
      tag-prefix: firefox-v
      changelog-paths: "apps/firefox/"
      cache-scope: firefox

  wechat:
    if: startsWith(github.ref_name, 'wechat-')
    uses: ./.github/workflows/release-image.yml
    with:
      image: ghcr.io/sion10032/kasmweb/wechat
      context: ./apps/wechat
      tag-prefix: wechat-v
      changelog-paths: "apps/wechat/"
      cache-scope: wechat
